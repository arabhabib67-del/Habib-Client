plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraftVersion", project.minecraft_version
    inputs.property "minecraftRange", "~${project.minecraft_version}"
    inputs.property "javaVersion", "25"
    filesMatching("fabric.mod.json") {
        expand "version": project.version,
               "updateRepo": project.update_repo,
               "minecraftVersion": project.minecraft_version,
               "minecraftRange": "~${project.minecraft_version}",
               "javaVersion": "25"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.named("jar") {
    archiveClassifier = "mc${project.minecraft_version}"
}

// Shared, mapping-independent appearance and OS integration.
sourceSets.main.java.srcDir("../../shared/src/main/java")

sourceSets.test.java.srcDir("../../shared/src/test/java")
tasks.register('verifyAppearance', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.habib.client.gui.theme.AppearanceChecks'
}
tasks.named('check') { dependsOn 'verifyAppearance' }

// The assertion runner is executed by verifyAppearance, not by a test-framework adapter.
tasks.named("test") { exclude "**/AppearanceChecks.class" }

// Shared font assets and their redistribution license.
sourceSets.main.resources.srcDir("../../shared/src/main/resources")
