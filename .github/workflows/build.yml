name: Build and release Habib Client
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: chmod +x gradlew && ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: habib-client-jar
          path: build/libs/*.jar
      - name: Publish a release for this version (once per mod_version)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          TAG="v$VER"
          JAR="build/libs/habib-client-$VER.jar"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - bump mod_version in gradle.properties to publish a new one."
          else
            gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --title "Habib Client $VER" --generate-notes
          fi
