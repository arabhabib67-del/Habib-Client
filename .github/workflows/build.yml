name: Build and release Habib Client
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-1-21-11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: chmod +x gradlew && ./gradlew remapJar
      - uses: actions/upload-artifact@v4
        with:
          name: habib-client-mc1.21.11
          path: build/libs/habib-client-*-mc1.21.11.jar
          if-no-files-found: error

  build-26-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - run: chmod +x gradlew && ./gradlew jar
        working-directory: versions/mc26.2
      - uses: actions/upload-artifact@v4
        with:
          name: habib-client-mc26.2
          path: versions/mc26.2/build/libs/habib-client-*-mc26.2.jar
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [build-1-21-11, build-26-2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: habib-client-mc*
          path: release-assets
          merge-multiple: true
      - name: Publish both Minecraft builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          MC26_VER=$(grep '^mod_version=' versions/mc26.2/gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ "$VER" != "$MC26_VER" ]; then
            echo "Minecraft 1.21.11 and 26.2 mod_version values must match."
            exit 1
          fi
          TAG="v$VER"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - bump mod_version in both Gradle property files to publish a new one."
          else
            BETA_URL=$(grep '^beta_access_url=' gradle.properties | cut -d= -f2- | tr -d '[:space:]')
            MC26_BETA_URL=$(grep '^beta_access_url=' versions/mc26.2/gradle.properties | cut -d= -f2- | tr -d '[:space:]')
            if [ -z "$BETA_URL" ] || [ "$BETA_URL" != "$MC26_BETA_URL" ]; then
              echo "Set the same beta_access_url in both Gradle property files before publishing a release."
              exit 1
            fi
            gh release create "$TAG" release-assets/*.jar --target "$GITHUB_SHA" --title "Habib Client $VER" --generate-notes
          fi
