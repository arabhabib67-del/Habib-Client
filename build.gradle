plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
def usageAnalyticsEndpoint = System.getenv("HABIB_ANALYTICS_URL") ?: project.findProperty("usage_analytics_endpoint") ?: ""

base {
    archivesName = project.archives_base_name
}

tasks.named("remapJar") {
    archiveClassifier = "mc${project.minecraft_version}"
}

repositories {
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraftVersion", project.minecraft_version
    inputs.property "minecraftRange", "~${project.minecraft_version}"
    inputs.property "javaVersion", "21"
    inputs.property "usageAnalyticsEndpoint", usageAnalyticsEndpoint
    filesMatching("fabric.mod.json") {
        expand "version": project.version,
               "updateRepo": (project.hasProperty('update_repo') ? project.property('update_repo') : ''),
               "minecraftVersion": project.minecraft_version,
               "minecraftRange": "~${project.minecraft_version}",
               "javaVersion": "21"
    }
    filesMatching("habib-analytics.properties") {
        expand "usageAnalyticsEndpoint": usageAnalyticsEndpoint,
               "version": project.version,
               "minecraft_version": project.minecraft_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Shared, mapping-independent appearance and OS integration.
sourceSets.main.java.srcDir("shared/src/main/java")

sourceSets.test.java.srcDir("shared/src/test/java")
tasks.register('verifyAppearance', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.habib.client.gui.theme.AppearanceChecks'
}
tasks.named('check') { dependsOn 'verifyAppearance' }

// The assertion runner is executed by verifyAppearance, not by a test-framework adapter.
tasks.named("test") { exclude "**/AppearanceChecks.class" }

// Shared font assets and their redistribution license.
sourceSets.main.resources.srcDir("shared/src/main/resources")
